[project]
name = "kaggriculture"
version = "0.1.0"
description = "Kaggriculture competition agent, local arena, and research tooling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kaggle-environments>=1.32.7",
    "kaggle>=2.2",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]
